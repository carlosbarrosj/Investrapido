<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Invest Rápido</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #0d1b2a; color: white; text-align: center; }
    header { padding: 40px 20px; }
    h1 { font-size: 2.5em; color: #00ffcc; }
    .box { background: #1b263b; padding: 20px; margin: 20px auto; width: 90%; max-width: 600px; border-radius: 10px; }
    button { background-color: #00ffcc; border: none; padding: 10px 20px; font-size: 1em; border-radius: 5px; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <h1>Invest Rápido</h1>
    <p>Plataforma de Investimento Rápido e Seguro</p>
  </header>
  <div class="box">
    <h2>Meu Saldo</h2>
    <p>R$ 390,00</p>
    <button>Sacar</button>
  </div>
  <div class="box">
    <h3>Planos de Investimento</h3>
    <p>10 opções de valores fixos</p>
  </div>
  <div class="box">
    <h3>Rendimento de 30% ao Mês</h3>
    <p>Rentabilidade inteligente com tecnologia global</p>
  </div>
  <div class="box">
    <h3>Programa de Indicação</h3>
    <p>Bônus de 8% por indicação</p>
  </div>
</body>
</html>
